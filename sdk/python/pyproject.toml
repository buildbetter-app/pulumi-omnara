[project]
  name = "pulumi_omnara"
  description = "A Pulumi provider for Omnara, the open-source managed agent platform. Generated from the Omnara OpenAPI specification."
  dependencies = ["packaging>=24.0", "pulumi>=3.142.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "omnara", "agents", "category/infrastructure", "kind/native"]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "0.1.0"
  [project.license]
    text = "Apache-2.0"
  [project.urls]
    Homepage = "https://github.com/buildbetter-app/pulumi-omnara"
    Repository = "https://github.com/buildbetter-app/pulumi-omnara"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_omnara = ["py.typed", "pulumi-plugin.json"]
