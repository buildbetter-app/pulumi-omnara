name: Release

# Push a v<semver> tag to publish provider binaries and SDK packages to a
# GitHub release. Also push sdk/v<semver> so `go get` resolves the Go SDK.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  PULUMI_VERSION: 3.274.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Provider binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SDK packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make sdks VERSION="$VERSION"
          make build-sdk-nodejs build-sdk-python
          (cd sdk/nodejs/bin && npm pack --pack-destination ../../../dist)
          (cd sdk/dotnet && dotnet pack -c Release -o ../../dist)
      - name: Attach SDK packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tgz dist/python/* dist/*.nupkg --clobber
